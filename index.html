<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tes Bahasa Arab Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🕌 Tes Bahasa Arab Online</h1>
            <p>Uji Kemampuan Bahasa Arab Anda</p>
        </div>
    </header>

    <main class="container">
        <section id="login-section" class="card">
            <h2>Masuk ke Tes</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="level">Pilih Level Tes</label>
                    <select id="level" name="level" required>
                        <option value="">-- Pilih Level --</option>
                        <option value="pemula">Pemula (Mubtadi')</option>
                        <option value="menengah">Menengah (Mutawassith)</option>
                        <option value="lanjutan">Lanjutan (Mutaqaddim)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Mulai Tes</button>
            </form>
        </section>

        <section id="test-section" class="card hidden">
            <div class="test-header">
                <h2>Soal Tes Bahasa Arab</h2>
                <div id="timer" class="timer">⏱️ 30:00</div>
            </div>
            <div id="question-container">
                <p class="question-number">Soal <span id="current-num">1</span> dari <span id="total-num">5</span></p>
                <h3 id="question-text" lang="ar" dir="rtl"></h3>
                <div id="options-container"></div>
            </div>
            <div class="test-navigation">
                <button id="prev-btn" class="btn-secondary">Sebelumnya</button>
                <button id="next-btn" class="btn-primary">Selanjutnya</button>
                <button id="submit-btn" class="btn-success hidden">Selesai</button>
            </div>
        </section>

        <section id="result-section" class="card hidden">
            <h2>Hasil Tes</h2>
            <div class="result-box">
                <p>Nama: <strong id="result-nama"></strong></p>
                <p>Level: <strong id="result-level"></strong></p>
                <p>Skor: <strong id="result-score"></strong></p>
                <p>Keterangan: <strong id="result-status"></strong></p>
            </div>
            <button id="restart-btn" class="btn-primary">Ulangi Tes</button>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Aplikasi Tes Bahasa Arab Online</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
